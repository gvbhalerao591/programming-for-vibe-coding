<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">The journey through a web application</title>
  <desc id="desc">The browser sends a request to the server. The server writes or reads the database, then sends a response to the browser. The browser updates the display.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#25475b"/></marker></defs>
  <rect width="960" height="280" fill="white"/>
  <g fill="#edf4f8" stroke="#25475b" stroke-width="2">
    <rect x="20" y="90" width="220" height="120" rx="8"/>
    <rect x="370" y="90" width="220" height="120" rx="8"/>
    <rect x="720" y="90" width="220" height="120" rx="8"/>
  </g>
  <g font-family="sans-serif" font-size="21" text-anchor="middle" fill="#172b3a">
    <text x="130" y="128">Browser</text><text x="130" y="161" font-size="17">Form and display</text>
    <text x="480" y="128">Server</text><text x="480" y="161" font-size="17">Checks and operations</text>
    <text x="830" y="128">Database</text><text x="830" y="161" font-size="17">Persistent records</text>
    <text x="305" y="66" font-size="17">Request</text><text x="305" y="246" font-size="17">Response</text>
    <text x="655" y="66" font-size="17">Read / write</text><text x="655" y="246" font-size="17">Result</text>
  </g>
  <g stroke="#25475b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M240 115 H365"/><path d="M370 185 H245"/>
    <path d="M590 115 H715"/><path d="M720 185 H595"/>
  </g>
</svg>
